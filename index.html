<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2430">
<title>Pokédex Tracker</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="sprites/152.png">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <label class="dex-picker">
      <span class="visually-hidden">Pokédex</span>
      <select id="dex-select"></select>
    </label>
    <button id="shiny-mode" class="mode-toggle" type="button" aria-pressed="false"
            title="When on, tapping a card marks it shiny instead of caught">
      <span class="mode-icon mode-star">✦</span> Shiny mode
    </button>
    <button id="box-view" class="mode-toggle mode-boxes" type="button" aria-pressed="false"
            title="Group the dex into 6 × 5 storage boxes, the way the in-game PC lays them out">
      <span class="mode-icon">▦</span> Boxes
    </button>
  </div>

  <div class="meters">
    <div class="meter" id="meter-caught">
      <div class="meter-head"><span class="meter-label">Caught</span><span class="meter-value"></span></div>
      <div class="meter-track"><div class="meter-fill"></div></div>
    </div>
    <div class="meter meter-shiny" id="meter-shiny">
      <div class="meter-head"><span class="meter-label">Shiny</span><span class="meter-value"></span></div>
      <div class="meter-track"><div class="meter-fill"></div></div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search name or number…"
             autocomplete="off" spellcheck="false" aria-label="Search Pokémon">
    </div>
    <div class="filters" role="group" aria-label="Filter">
      <button type="button" class="chip is-active" data-filter="all">All</button>
      <button type="button" class="chip" data-filter="missing">Missing</button>
      <button type="button" class="chip" data-filter="caught">Caught</button>
      <button type="button" class="chip" data-filter="shiny">Shiny</button>
    </div>
  </div>
</header>

<main>
  <p id="status" class="status" role="status">Loading…</p>
  <div id="grid" class="grid"></div>
</main>

<footer class="footer">
  <div class="footer-actions">
    <button id="export" type="button" class="btn">Export progress</button>
    <button id="import" type="button" class="btn">Import progress</button>
    <button id="reset" type="button" class="btn btn-danger">Reset this dex</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </div>
  <p class="footer-note">
    Progress is saved in this browser only — export a backup before clearing site data,
    and use export/import to move progress between your phone and computer.
  </p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
